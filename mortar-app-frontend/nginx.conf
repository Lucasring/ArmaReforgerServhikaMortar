server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Block common vulnerable paths
    location ~* ^/(sql|mysql|phpmyadmin|pma|dbadmin|admin|wp-admin|wp-content|wp-includes|\.git|\.env) {
        return 444;
    }

    # Allow static assets
    location ~* \.(jpg|ico|css|js|json)$ {
        try_files $uri =404;
    }

    # Allow _app directory for Svelte assets
    location ^~ /_app/ {
        try_files $uri =404;
    }

    # Default handler for SPA
    location / {
        try_files $uri /index.html;
    }

    # Route /api/ requests to the FastAPI backend
    location /api/ {
        # 'backend' is the service name in your docker-compose.yaml
        proxy_pass http://backend:8000/api/;
        
        # Standard proxy headers to pass real client info to FastAPI
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Optional: Handle long-running requests or large uploads
        proxy_read_timeout 90;
        proxy_connect_timeout 90;
    }
    
}
